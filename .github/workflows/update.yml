name: Daily update & deploy

on:
  schedule:
    - cron: '30 22 * * 1-5'   # after the US close (~02:00 Tehran)
    - cron: '0 14 * * 1-5'    # catch-up run for late FRED postings and the ECB 16:00 CET fixing
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '*.py', 'requirements.txt', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # previous downloads are the fallback when FRED or the ECB is unreachable
      - uses: actions/cache@v4
        with:
          path: data
          key: source-data-${{ github.run_id }}
          restore-keys: source-data-

      - name: Fetch FRED + ECB
        run: python fetch_fred.py || echo "::warning::some series failed to download; using cached copies"

      - name: Build site data
        run: python export_site.py

      - name: Commit site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
